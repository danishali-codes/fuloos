apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def envVersionCode = System.getenv("FULOOS_VERSION_CODE") ?: (project.findProperty("versionCode") ?: "1")
def resolvedVersionCode = envVersionCode.toString().isInteger() ? Math.max(1, envVersionCode.toString().toInteger()) : 1
def resolvedVersionName = (System.getenv("FULOOS_VERSION_NAME") ?: (project.findProperty("versionName") ?: "1.0.0")).toString()

def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def keyAliasName = System.getenv("ANDROID_KEY_ALIAS")
def keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = keystorePath && file(keystorePath).exists() && keystorePassword && keyAliasName && keyPasswordValue

android {
    namespace = "dev.danishali.fuloos"
    compileSdk = rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "dev.danishali.fuloos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    flavorDimensions += "distribution"
    productFlavors {
        direct {
            dimension "distribution"
            buildConfigField "boolean", "SUPPORTS_DIRECT_SMS", "true"
            buildConfigField "String", "BUILD_FLAVOR", '"direct"'
        }
        play {
            dimension "distribution"
            buildConfigField "boolean", "SUPPORTS_DIRECT_SMS", "false"
            buildConfigField "String", "BUILD_FLAVOR", '"play"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation project(':capacitor-android')

    // Native SMS automation, offline WorkManager queue, headless V8 engine, Keystore & Biometrics
    implementation "androidx.work:work-runtime-ktx:2.10.1"
    implementation "androidx.javascriptengine:javascriptengine:1.0.0-rc01"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.10.1"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
